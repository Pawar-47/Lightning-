name: Bootstrap Gradle wrapper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-gradle-wrapper.yml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - "gradlew"
permissions:
  contents: write

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Generate standard Gradle wrapper
        run: gradle --no-daemon wrapper --gradle-version 8.12.1 --distribution-type bin
      - name: Commit wrapper files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle wrapper is already up to date."
            exit 0
          fi
          git commit -m "Add standard Gradle wrapper JAR"
          git push
