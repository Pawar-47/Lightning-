name: Shaderpack validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shader source structure
        run: python tools/validate_shaderpack.py
      - name: Syntax-check audit and test tools
        run: python -m py_compile tools/verify_source_port.py tools/compile_shader_stages.py tools/run_iris_smoke.py
      - name: Install GLSL compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools
      - name: Compile every shader entrypoint
        run: python tools/compile_shader_stages.py
      - name: Install headless graphics runtime
        run: sudo apt-get install --yes xvfb libgl1-mesa-dri
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build shaderpack ZIP
        run: ./gradlew --no-daemon zipShaderpack
      - name: Iris development-client smoke test
        run: python tools/run_iris_smoke.py
      - name: Upload shaderpack artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lightning-shaderpack
          path: build/releases/*.zip
      - name: Upload Iris smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lightning-iris-smoke-log
          path: build/iris-smoke.log
          if-no-files-found: ignore

      - name: Publish Lightning pre-release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.0-alpha.2"
          asset="build/releases/Lightning-0.1.0-alpha.2-shaderpack.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "Lightning v0.1.0-alpha.2" \
              --notes-file docs/RELEASE_NOTES_v0.1.0-alpha.2.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
