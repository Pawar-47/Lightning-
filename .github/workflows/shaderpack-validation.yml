name: Shaderpack validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shader source structure
        run: python tools/validate_shaderpack.py
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Build shaderpack ZIP
        run: gradle --no-daemon zipShaderpack
      - name: Upload shaderpack artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lightning-shaderpack
          path: build/releases/*.zip
