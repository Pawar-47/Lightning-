# Lightning shaderpack settings
# Porting baseline: MakeUp Ultra Fast v9.6 reference, adapted for Iris.
# All profile values remain provisional until the matching GLSL options are ported.

# Intel HD 5500 feature-preserving profile.
# Keep the full feature set enabled; performance is managed through lower budgets in shader code.
profile.Performance = SHADOW_CASTING SHADOW_QTY_SLIDER=1 SHADOW_DISTANCE_SLIDER=0 REFLECTION_SLIDER=2 REFRACTION=1 SUN_REFLECTION=1 AO=1 AOSTEPS=4 AA_TYPE=2 DOF MOTION_BLUR MOTION_BLUR_SAMPLES=3 MOTION_BLUR_STRENGTH=0.75 V_CLOUDS=1 CLOUD_STEPS_AVG=6 CLOUD_REFLECTION COLORED_SHADOW BLOOM BLOOM_SAMPLES=2 VOL_LIGHT=1 MATERIAL_GLOSS END_CLOUDS

# Higher quality comparison profile. Use only after the performance profile is stable.
profile.Quality = SHADOW_CASTING SHADOW_QTY_SLIDER=2 SHADOW_DISTANCE_SLIDER=1 REFLECTION_SLIDER=2 REFRACTION=1 SUN_REFLECTION=1 AO=1 AOSTEPS=6 AA_TYPE=3 DOF MOTION_BLUR MOTION_BLUR_SAMPLES=5 V_CLOUDS=2 CLOUD_STEPS_AVG=10 CLOUD_REFLECTION COLORED_SHADOW BLOOM BLOOM_SAMPLES=4 VOL_LIGHT=2 MATERIAL_GLOSS END_CLOUDS

# Runtime defaults and conservative culling.
vignette = false
separateAo = false
oldLighting = false
dynamicHandLight = true
oldHandLight = false
underwaterOverlay = false
sun = true
moon = true
frustum.culling = true
shadow.culling = true
particles.before.deferred = true

# Do not skip post-processing passes when their effects are enabled.
program.shadow.enabled = SHADOW_CASTING
program.composite1.enabled = BLOOM || DOF
program.composite2.enabled = AA_TYPE || MOTION_BLUR

# NOTE: Shader feature options are only effective after their GLSL definitions and
# corresponding program stages have been ported. This file does not itself implement effects.
